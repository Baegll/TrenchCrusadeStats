<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Trench Analytics Dashboard</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:system-ui,sans-serif;background:#111;color:#e0e0e0;padding:1rem}
h1{font-size:1.3rem;margin-bottom:1rem;color:#ccc}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:1rem;margin-bottom:1rem}
.card{background:#1a1a1a;border:1px solid #333;border-radius:8px;padding:1rem}
.card h2{font-size:.85rem;text-transform:uppercase;color:#888;margin-bottom:.5rem;letter-spacing:.05em}
.card .val{font-size:1.8rem;font-weight:700}
.ok{color:#4ade80}.err{color:#f87171}.warn{color:#facc15}.idle{color:#888}
table{width:100%;border-collapse:collapse;font-size:.85rem}
th,td{text-align:left;padding:.4rem .6rem;border-bottom:1px solid #222}
th{color:#888;text-transform:uppercase;font-size:.75rem}
.bar{height:6px;background:#333;border-radius:3px;overflow:hidden;min-width:60px}
.bar-fill{height:100%;background:#4ade80;border-radius:3px}
.auth{margin-bottom:1rem;display:flex;gap:.5rem;align-items:center}
.auth input{background:#222;border:1px solid #444;color:#e0e0e0;padding:.4rem .6rem;border-radius:4px;font-size:.85rem}
.auth button{background:#333;border:1px solid #555;color:#e0e0e0;padding:.4rem .8rem;border-radius:4px;cursor:pointer;font-size:.85rem}
.auth button:hover{background:#444}
#status{font-size:.75rem;color:#888;margin-top:.5rem}
</style>
</head>
<body>
<h1>&#9876; Trench Analytics</h1>
<div class="auth">
<input id="apiKey" type="password" placeholder="API Key" autocomplete="off">
<button onclick="startPolling()">Connect</button>
<span id="authStatus"></span>
</div>

<div class="grid">
<div class="card"><h2>Health</h2><div class="val" id="health">—</div><div id="lastIngestion" style="font-size:.75rem;color:#888;margin-top:.3rem"></div></div>
<div class="card"><h2>Sync Status</h2><div class="val" id="syncStatus">—</div><div id="syncProgress" style="margin-top:.5rem;display:none"><div class="bar" style="height:10px"><div class="bar-fill" id="syncBar" style="width:0%"></div></div><div style="font-size:.75rem;color:#888;margin-top:.3rem" id="syncProgressText"></div></div><div id="syncDetail" style="font-size:.75rem;color:#888;margin-top:.3rem"></div><div id="syncPrev" style="font-size:.75rem;color:#666;margin-top:.3rem"></div></div>
<div class="card"><h2>Total Games</h2><div class="val" id="totalGames">—</div></div>
<div class="card"><h2>Ranked / Unranked</h2><div class="val" id="rankedSplit">—</div></div>
</div>

<div class="card" style="margin-bottom:1rem">
<h2>Faction Win Rates</h2>
<table><thead><tr><th>Faction</th><th>Win Rate</th><th></th><th>Games</th><th>Pick Rate</th></tr></thead>
<tbody id="factionBody"><tr><td colspan="5" style="color:#888">Connect to load data</td></tr></tbody>
</table>
</div>

<div id="status"></div>

<script>
let key=localStorage.getItem('tc_api_key')||'',timer=null;

function hdr(){return {'X-Api-Key':key}}

async function fetchJSON(url,opts){
  const r=await fetch(url,opts);
  if(!r.ok) throw new Error(r.status);
  return r.json();
}

function setEl(id,html){document.getElementById(id).innerHTML=html}

async function pollHealth(){
  try{
    const d=await fetchJSON('/api/v1/health');
    const cls=d.status==='ok'?'ok':'err';
    setEl('health',`<span class="${cls}">${d.status.toUpperCase()}</span>`);
    setEl('lastIngestion',d.last_ingestion?`Last ingestion: ${new Date(d.last_ingestion).toLocaleString()}`:'');
  }catch(e){setEl('health','<span class="err">ERROR</span>')}
}

async function pollSync(){
  try{
    const d=await fetchJSON('/api/v1/sync/status',{headers:hdr()});
    const cls={completed:'ok',running:'warn',failed:'err',no_runs:'idle'}[d.status]||'idle';
    setEl('syncStatus',`<span class="${cls}">${d.status.toUpperCase()}</span>`);

    // Progress bar — show for running, completed, and failed
    const prog=document.getElementById('syncProgress');
    const bar=document.getElementById('syncBar');
    if(d.status!=='no_runs'&&d.ids_scanned>0){
      prog.style.display='block';
      const total=d.total_items||d.ids_scanned;
      const pct=Math.min(100,(d.ids_scanned/total*100)).toFixed(1);
      bar.style.width=pct+'%';
      bar.style.background=d.status==='failed'?'#f87171':d.status==='running'?'#facc15':'#4ade80';
      setEl('syncProgressText',`${d.ids_scanned.toLocaleString()} / ${total.toLocaleString()} records (${pct}%)`);
    }else{prog.style.display='none'}

    // Current run timestamps
    let detail=[];
    if(d.started_at) detail.push('Started: '+new Date(d.started_at).toLocaleString());
    if(d.completed_at) detail.push('Finished: '+new Date(d.completed_at).toLocaleString());
    if(d.reports_inserted) detail.push('Inserted: '+d.reports_inserted);
    if(d.errors) detail.push('Errors: '+d.errors);
    setEl('syncDetail',detail.join(' · '));

    // Previous run timestamps
    let prev=[];
    if(d.prev_started_at) prev.push('Prev run: '+new Date(d.prev_started_at).toLocaleString());
    if(d.prev_completed_at) prev.push('→ '+new Date(d.prev_completed_at).toLocaleString());
    setEl('syncPrev',prev.join(' '));
  }catch(e){setEl('syncStatus','<span class="err">—</span>')}
}

async function pollSummary(){
  try{
    const d=await fetchJSON('/api/v1/stats/summary',{headers:hdr()});
    setEl('totalGames',d.total_games.toLocaleString());
    setEl('rankedSplit',`${d.ranked_games.toLocaleString()} / ${d.unranked_games.toLocaleString()}`);
  }catch(e){setEl('totalGames','<span class="err">—</span>')}
}

async function pollFactions(){
  try{
    const d=await fetchJSON('/api/v1/stats/factions?min_games=1',{headers:hdr()});
    const rows=d.factions||[];
    if(!rows.length){setEl('factionBody','<tr><td colspan="5" style="color:#888">No data</td></tr>');return}
    rows.sort((a,b)=>b.win_rate-a.win_rate);
    setEl('factionBody',rows.map(f=>`<tr>
      <td>${f.display_name}</td>
      <td>${(f.win_rate*100).toFixed(1)}%</td>
      <td><div class="bar"><div class="bar-fill" style="width:${(f.win_rate*100).toFixed(0)}%"></div></div></td>
      <td>${f.total_games}</td>
      <td>${(f.pick_rate*100).toFixed(1)}%</td>
    </tr>`).join(''));
  }catch(e){setEl('factionBody','<tr><td colspan="5" class="err">Failed to load</td></tr>')}
}

async function poll(){
  setEl('status','Last poll: '+new Date().toLocaleTimeString());
  await Promise.allSettled([pollHealth(),pollSync(),pollSummary(),pollFactions()]);
}

function startPolling(){
  key=document.getElementById('apiKey').value;
  if(!key){setEl('authStatus','<span class="err">Enter API key</span>');return}
  localStorage.setItem('tc_api_key',key);
  setEl('authStatus','<span class="ok">Connected</span>');
  if(timer) clearInterval(timer);
  poll();
  timer=setInterval(poll,15000);
}

// Health is public, poll it immediately
pollHealth();
// Auto-connect if key was saved
if(key){document.getElementById('apiKey').value=key;startPolling()}
</script>
</body>
</html>
